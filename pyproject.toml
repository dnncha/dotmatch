[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dotmatch"
version = "0.3.1"
description = "Known-target short-DNA assignment from FASTQ for CRISPR guides, barcodes, feature tags, primers, and other targets"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tomli; python_version < \"3.11\"",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Donncha O'Toole"}
]
keywords = [
    "bioinformatics",
    "computational biology",
    "CRISPR",
    "FASTQ",
    "known-target assignment",
    "feature barcodes",
    "sequencing QC",
    "barcode demultiplexing",
    "guide capture",
    "Perturb-seq",
    "barcode panel design",
    "edit distance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
pandas = ["pandas>=1.0"]
anndata = ["anndata>=0.8", "pandas>=1.0"]
polars = ["polars>=0.19"]
multiqc = ["multiqc>=1.20"]
dev = ["pytest", "pandas>=1.0", "anndata>=0.8", "polars>=0.19", "multiqc>=1.20"]

[project.urls]
Homepage = "https://dnncha.github.io/dotmatch/"
Repository = "https://github.com/dnncha/dotmatch"
Issues = "https://github.com/dnncha/dotmatch/issues"
Documentation = "https://dotmatch.readthedocs.io/en/latest/"
"Agent guide" = "https://dotmatch.readthedocs.io/en/latest/agent-guide.html"
Changelog = "https://github.com/dnncha/dotmatch/blob/main/CHANGELOG.md"
Examples = "https://github.com/dnncha/dotmatch/tree/main/examples"
Bioconda = "https://anaconda.org/bioconda/dotmatch"
Container = "https://github.com/dnncha/dotmatch/pkgs/container/dotmatch"

[tool.setuptools]
package-dir = {"" = "python"}

[project.entry-points."multiqc.modules.v1"]
dotmatch = "dotmatch.multiqc:DotMatchModule"

[project.entry-points."multiqc.hooks.v1"]
before_config = "dotmatch.multiqc:load_config"

[tool.setuptools.packages.find]
where = ["python"]
include = ["assaycode*", "dotmatch*", "quickdna*"]

[project.scripts]
assaycode = "assaycode.cli:main"
dotmatch = "dotmatch.cli:main"
quickdna = "dotmatch.cli:main"

[tool.cibuildwheel]
build = "cp39-manylinux_x86_64 cp39-manylinux_aarch64 cp310-manylinux_x86_64 cp310-manylinux_aarch64 cp311-manylinux_x86_64 cp311-manylinux_aarch64 cp312-manylinux_x86_64 cp312-manylinux_aarch64 cp39-musllinux_x86_64 cp39-musllinux_aarch64 cp310-musllinux_x86_64 cp310-musllinux_aarch64 cp311-musllinux_x86_64 cp311-musllinux_aarch64 cp312-musllinux_x86_64 cp312-musllinux_aarch64"
test-command = "python -c \"import dotmatch, quickdna; assert dotmatch.distance('ACGT', 'AGGT') == 1; assert quickdna.distance_leq('ACGT', 'AGGT', 1)\" && assaycode --version && dotmatch --version && test \"$(dotmatch dist ACGT AGGT)\" = 1 && test \"$(dotmatch leq 1 ACGT AGGT)\" = true"
