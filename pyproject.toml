[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "editwitness"
version = "0.2.0a2"
description = "Explicit counterexamples and assay blind-spot analysis for CRISPR validation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Donncha O'Toole"}]
keywords = ["CRISPR", "amplicon", "allelic-dropout", "identifiability", "assay-design", "bioinformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.7,<3"]

[project.urls]
Source = "https://github.com/dnncha/dotmatch/tree/editwitness/research-alpha-20260906"
Documentation = "https://github.com/dnncha/dotmatch/tree/editwitness/research-alpha-20260906/docs"
Releases = "https://github.com/dnncha/dotmatch/releases/tag/editwitness-v0.2.0a2"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "coverage[toml]>=7.10,<8", "jsonschema>=4,<5", "build>=1,<2", "ruff>=0.9", "mypy>=1.13,<2"]

[project.scripts]
editwitness = "editwitness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
editwitness = ["py.typed", "schemas/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["editwitness"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
