name: Workflow integration review
description: Propose or review an external DotMatch workflow integration.
title: "[Integration]: "
labels: ["workflow", "integration", "needs-triage"]
body:
  - type: dropdown
    id: workflow_manager
    attributes:
      label: Workflow Manager
      options:
        - nf-core / Nextflow
        - MultiQC
        - Galaxy / IUC
        - Snakemake
        - bio.tools
        - Institutional workflow
    validations:
      required: true
  - type: textarea
    id: workflow_context
    attributes:
      label: Workflow Context
      description: Which known-target assay workflow would this integration support?
    validations:
      required: true
  - type: textarea
    id: source_assets
    attributes:
      label: Source Assets
      description: Link the local module, wrapper, fixture, parser, schema, or registry draft.
    validations:
      required: true
  - type: textarea
    id: expected_outputs
    attributes:
      label: Expected Outputs
      description: List the TSV, JSON, FASTQ, HTML, MultiQC, or citation artifacts the integration should expose.
    validations:
      required: true
  - type: textarea
    id: review_evidence
    attributes:
      label: Review Evidence
      description: Include commands, CI links, fixture paths, lint output, or external review links.
      render: bash
    validations:
      required: false
  - type: textarea
    id: validated_scope
    attributes:
      label: Validated Scope
      description: State what the integration supports and what it must not imply.
    validations:
      required: true
