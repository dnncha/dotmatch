name: Evaluation feedback
description: Record scoped feedback from a DotMatch technical evaluation.
title: "[Evaluation]: "
labels: ["evaluation", "feedback", "needs-triage"]
body:
  - type: dropdown
    id: assay_context
    attributes:
      label: Assay Context
      options:
        - CRISPR guide counting
        - Inline barcode demultiplexing
        - Feature barcode assignment
        - Perturb-seq guide capture
        - Amplicon or panel target assignment
        - Oligo or adapter-prefix assignment
        - Other known-target workflow
    validations:
      required: true
  - type: textarea
    id: install_path
    attributes:
      label: Install Path
      description: State PyPI, Bioconda, source checkout, container, or workflow wrapper version.
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs
      description: Describe the target table and read window without sharing private raw data.
    validations:
      required: true
  - type: checkboxes
    id: outputs_reviewed
    attributes:
      label: Outputs Reviewed
      options:
        - label: sample_qc.tsv
        - label: summary.json
        - label: assignments.tsv
        - label: top_unmatched.tsv
        - label: HTML report
        - label: methods.md / CITATION.bib / software_versions.yml
  - type: textarea
    id: findings
    attributes:
      label: Findings
      description: What became clearer or blocked the evaluation?
    validations:
      required: true
  - type: dropdown
    id: public_use_permission
    attributes:
      label: Public Use Permission
      options:
        - No public use record approved
        - Anonymized summary approved
        - Public project name approved
        - Approved public use record text and URL
    validations:
      required: true
