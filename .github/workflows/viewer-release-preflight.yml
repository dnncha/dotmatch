name: viewer-release-preflight

on:
  push:
    branches: [codex/viewer-release-preflight-20260915]
    paths: [.github/workflows/viewer-release-preflight.yml]

# This isolated staging job creates content-addressed blobs only. It cannot
# merge, release or change a branch: the final ref change is reviewed separately.
permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: staged
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 159ebd3f140808ae5c2f23af7419ebdb29a250bc
          path: candidate
          persist-credentials: false
      - name: Retrieve the exact previously audited dependency proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34968433007 --repo dnncha/dotmatch --name viewer-dependency-proposal --dir deps
      - name: Verify exact patch and every reviewed byte before storing blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path.cwd()
          repo = root / 'candidate'
          staged = root / 'staged/review-impact'
          patch = gzip.decompress(base64.b64decode(''.join((staged / f'patch.{i}.b64').read_text().strip() for i in range(3)), validate=True))
          assert len(patch) == 49265
          assert hashlib.sha256(patch).hexdigest() == '2e12c055811ba8d5113722b6a2c966bc1c5036745877bb465e258c1056e09676'
          base = subprocess.check_output(['git','rev-parse','HEAD'], cwd=repo, text=True).strip()
          assert base == '159ebd3f140808ae5c2f23af7419ebdb29a250bc'
          subprocess.run(['git','apply','--index','--unidiff-zero','--check','-'], cwd=repo, input=patch, check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero','-'], cwd=repo, input=patch, check=True)
          lock = (root / 'deps/package-lock.json').read_bytes()
          def blob_sha(content):
              return hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
          assert blob_sha(lock) == '8369becb521ccea045c3cfa886640365b2fe8214'
          (repo / 'package-lock.json').write_bytes(lock)
          subprocess.run(['git','add','package-lock.json'], cwd=repo, check=True)
          expected = {
            '.github/workflows/ci.yml':'03bb5c9996d0f45cd68d0f173db38bb268ef43fb',
            '.github/workflows/pages.yml':'74a0d04603002c4c41b240531c9db34b8ea2a290',
            '.github/workflows/sensitivity-review.yml':'667003325cbf40d3264725eab4a977be717b4f3d',
            '.github/workflows/site-validation.yml':'7603ce3a0509387036b4a6fd0abb790166287744',
            '.gitignore':'ff31f76ec067a9c55fc6eb3ee68626c822229314',
            'CHANGELOG.md':'5560502a422dd3f68666c8a9e12250c6cbe8e14c',
            'README.md':'156ddd48b9e694c9aa3f8c9cb3800fc64d596e3e',
            'app/assignment-sensitivity/page.tsx':'204a1c05dcca8575eab6d5716a75eb981ed81e6c',
            'app/page.tsx':'34dba9eeb9d2c34bcae7cc5071ed555e12530e5f',
            'app/site-metadata.ts':'84f0afc010b82a1fd222b90f6993195464c5a8d7',
            'docs/llms-full.txt':'43d057d1320c6a82992e34b6082956caf4df72e6',
            'docs/llms.txt':'a3a561519541a5059890566fcf4f6c2bfbbd7a8b',
            'docs/sensitivity-review.md':'aea31268f0cefc4943dceef5369cb6fb7c3cc423',
            'llms-full.txt':'43d057d1320c6a82992e34b6082956caf4df72e6',
            'llms.txt':'a3a561519541a5059890566fcf4f6c2bfbbd7a8b',
            'package-lock.json':'8369becb521ccea045c3cfa886640365b2fe8214',
            'package.json':'ca049aa6c05d91b9d2e5fd17184e1e7110b11971',
            'public/llms-full.txt':'43d057d1320c6a82992e34b6082956caf4df72e6',
            'public/llms.txt':'a3a561519541a5059890566fcf4f6c2bfbbd7a8b',
            'python/tests/test_sensitivity_demo.py':'cf4dcd5b2b3a757eb2615cc894a1f810fb79e04c',
            'scripts/build_sensitivity_demo.py':'995433941dd7cb83dfde882599c0223705879d8a',
            'scripts/check_sensitivity_demo.py':'a1dd17f2ee3cd4c2e40a9b046f7df0554be67101',
            'scripts/check_sensitivity_review.py':'8f62c44921736146e82ad2f2f605feecf9510c3e',
            'scripts/check_site_assets.mjs':'326381a7dc0318ce98fe94662c9f19004c0fa94c',
            'scripts/check_site_browser.py':'5c13d37e8a94099c1ac7347a7c3825a2c006ab91',
            'scripts/check_site_export.mjs':'49630871927154e1dc0d5f476ee9a0498cf53632',
            'tests/site/review-entry.test.mjs':'32aed3470a93210097318303340450493aad815d'
          }
          changed = subprocess.check_output(['git','diff','--cached','--name-only'], cwd=repo, text=True).splitlines()
          assert set(changed) == set(expected)
          for path, sha in expected.items():
              assert blob_sha((repo / path).read_bytes()) == sha, path
          subprocess.run(['git','diff','--cached','--check'], cwd=repo, check=True)
          created = set()
          for path, sha in expected.items():
              if sha in created:
                  continue
              content = (repo / path).read_bytes()
              payload = json.dumps({'content':base64.b64encode(content).decode(), 'encoding':'base64'}).encode()
              req = urllib.request.Request('https://api.github.com/repos/dnncha/dotmatch/git/blobs', data=payload, method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', 'Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == sha, path
              created.add(sha)
          receipt = {'base_commit':base, 'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'], cwd=repo, text=True).strip(), 'verified_blobs':expected, 'branch_changed':False, 'release_created':False}
          (root/'receipt').mkdir()
          (root/'receipt/verified-blobs.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: viewer-reviewed-blobs
          path: receipt/
