name: Assignment robustness research
on:
  push:
    branches: [research/assignment-robustness-2026-09]
    paths:
      - research/assignment_robustness/pilot.py
      - .github/workflows/assignment-robustness-research.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assignment-robustness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate independent oracle and strict parsers
        run: python research/assignment_robustness/pilot.py test
      - name: Build pinned baseline package without optional dependencies
        run: |
          python -m pip install --no-deps .
          dotmatch --version
          python -m pip freeze > research-environment.txt
          git rev-parse HEAD > research-commit.txt
      - name: Execute six-sample public archival-prefix pilot
        env:
          PYTHONUNBUFFERED: '1'
        run: python research/assignment_robustness/pilot.py run --out study-output
      - name: Retain aggregates, provenance and research code, not raw FASTQs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assignment-robustness-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            study-output/**
            !study-output/work/**
            research/assignment_robustness/**
            research-environment.txt
            research-commit.txt
