name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  preflight:
    name: Release preflight gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install release tooling
        run: python -m pip install build pytest
      - name: Install documentation tooling
        run: python -m pip install -r docs/requirements.txt
      - name: Run release gates
        run: |
          make test
          make cli-test
          make asan
          make python-test
          make repository-ready
          make release-ready
          make python-package-test

  wheel:
    name: Build ${{ matrix.label }} wheel
    needs: [preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux raw
            artifact_name: dotmatch-wheel-linux-raw
          - os: macos-latest
            label: macOS
            artifact_name: dotmatch-wheel-macos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install build
      - name: Build and verify wheel
        run: python scripts/check_python_wheel.py --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.whl

  linux-repaired-wheels:
    name: Build manylinux/musllinux wheels
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up QEMU for Linux aarch64 wheel tests
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Build and test repaired Linux wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_PLATFORM: linux
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
        with:
          output-dir: dist-linux
      - name: Verify repaired Linux wheels
        run: python scripts/check_python_wheel.py --wheel-only --out-dir dist-linux --require-repaired-linux-architectures x86_64 aarch64
      - uses: actions/upload-artifact@v7
        with:
          name: dotmatch-linux-repaired-wheels
          path: dist-linux/*.whl

  sdist:
    name: Build source distribution
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install build
      - name: Build and verify source distribution
        run: python scripts/check_python_wheel.py --sdist-only --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: dotmatch-sdist
          path: dist/*.tar.gz

  container:
    name: Build container image
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU for Linux arm64 container tests
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build local smoke-test image
        run: docker build -t dotmatch:ci .
      - name: Smoke test container
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          docker run --rm dotmatch:ci --version | grep "^dotmatch ${VERSION}$"
          docker run --rm dotmatch:ci dist ACGT AGGT | grep '^1$'
          docker run --rm dotmatch:ci leq 1 ACGT AGGT | grep '^true$'
          docker image inspect dotmatch:ci --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' | grep "^${VERSION}$"
      - name: Build Linux arm64 smoke-test image
        run: docker buildx build --platform linux/arm64 --load -t dotmatch:ci-arm64 .
      - name: Smoke test Linux arm64 container
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          docker run --rm --platform linux/arm64 dotmatch:ci-arm64 --version | grep "^dotmatch ${VERSION}$"
          docker run --rm --platform linux/arm64 dotmatch:ci-arm64 dist ACGT AGGT | grep '^1$'
          docker run --rm --platform linux/arm64 dotmatch:ci-arm64 leq 1 ACGT AGGT | grep '^true$'
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/dnncha/dotmatch
          tags: |
            type=ref,event=tag
            type=sha
          labels: |
            org.opencontainers.image.title=DotMatch
            org.opencontainers.image.description=Deterministic known-target short-DNA assignment for CRISPR guides, barcodes, panels, and whitelist-style target sets.
            org.opencontainers.image.source=https://github.com/dnncha/dotmatch
            org.opencontainers.image.url=https://dotmatch.readthedocs.io/
            org.opencontainers.image.documentation=https://dotmatch.readthedocs.io/
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.authors=Donncha O'Toole
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify published multi-architecture manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker buildx imagetools inspect "ghcr.io/dnncha/dotmatch:${VERSION}" --raw > ghcr-manifest.json
          python scripts/check_oci_manifest.py ghcr-manifest.json \
            --require-platform linux/amd64 \
            --require-platform linux/arm64

  pypi-sdist:
    name: Publish PyPI sdist, macOS wheel, and repaired Linux wheels
    if: startsWith(github.ref, 'refs/tags/')
    needs: [preflight, sdist, wheel, linux-repaired-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dotmatch/
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dotmatch-sdist
          path: dist-pypi
      - uses: actions/download-artifact@v8
        with:
          name: dotmatch-wheel-macos
          path: dist-pypi
      - uses: actions/download-artifact@v8
        with:
          name: dotmatch-linux-repaired-wheels
          path: dist-pypi
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi

  github-release:
    name: Create GitHub release artifacts
    if: startsWith(github.ref, 'refs/tags/')
    needs: [preflight, wheel, sdist, linux-repaired-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
