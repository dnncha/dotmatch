name: Installed count comparison

on:
  pull_request:
    paths:
      - 'python/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'examples/count_comparison/**'
      - '.github/workflows/count-comparison.yml'
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'examples/count_comparison/**'
      - '.github/workflows/count-comparison.yml'

permissions:
  contents: read

concurrency:
  group: installed-count-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build installable candidate
        run: |
          python -m pip install build
          python -m build
      - name: Exercise installed console script outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          work="$(mktemp -d)"
          python -m venv "$work/venv"
          "$work/venv/bin/python" -m pip install --no-index --no-deps "$root"/dist/*.whl
          cp examples/count_comparison/*.tsv "$work/"
          cd "$work"
          unset PYTHONPATH DOTMATCH_LIB DOTMATCH_NATIVE_CLI
          "$work/venv/bin/dotmatch-compare-counts" --baseline baseline.tsv --candidate candidate.tsv --out-dir comparison
          printf 'sgRNA\tGene\tsample\nrenamed-guide\tG1\t1\n' > renamed.tsv
          printf 'baseline\tcandidate\ng1\trenamed-guide\n' > guides.tsv
          printf 'sgRNA\tGene\tsample\ng1\tG1\t1\n' > mapped-baseline.tsv
          "$work/venv/bin/dotmatch-compare-counts" --baseline mapped-baseline.tsv --candidate renamed.tsv --guide-map guides.tsv --out-dir mapped --fail-on-difference
          "$work/venv/bin/dotmatch-compare-counts" --baseline baseline.tsv --candidate baseline.tsv --out-dir identical --fail-on-difference
          status=0
          "$work/venv/bin/dotmatch-compare-counts" --baseline baseline.tsv --candidate candidate.tsv --out-dir regression --fail-on-difference || status=$?
          test "$status" = 1
          "$work/venv/bin/python" - <<'PY'
          import hashlib, json
          from pathlib import Path
          report = json.loads(Path('comparison/report.json').read_text())
          assert report['scope'] == 'complete'
          assert sum(s['changed_guides'] for s in report['samples']) == 4
          assert all(s['same_total_different_counts'] for s in report['samples'])
          mapped = json.loads(Path('mapped/report.json').read_text())
          assert mapped['guide_map']['pairs'] == [{'baseline': 'g1', 'candidate': 'renamed-guide'}]
          assert mapped['any_count_difference'] is False
          for folder in ('comparison', 'identical', 'regression', 'mapped'):
              base = Path(folder)
              manifest = json.loads((base / 'manifest.json').read_text())
              assert manifest['status'] == 'complete'
              for name, expected in manifest['files'].items():
                  data = (base / name).read_bytes()
                  assert hashlib.sha256(data).hexdigest() == expected['sha256']
                  assert len(data) == expected['bytes']
          print('Installed console script: differing, identical and regression runs verified')
          PY
          "$work/venv/bin/dotmatch" demo --out-dir first-run
          "$work/venv/bin/dotmatch" crispr quickstart --library first-run/inputs/targets.tsv --fastq first-run/inputs/reads.fastq --link-reads --max-start 0 --out prepared
          "$work/venv/bin/python" - <<'PYCODE'
          import json, socket
          from pathlib import Path
          from dotmatch.first_run import run_demo
          def no_network(*args, **kwargs):
              raise AssertionError("offline demo attempted a network connection")
          socket.socket.connect = no_network
          run_demo("offline-first-run")
          report = json.loads(Path("prepared/inference_report.json").read_text())
          assert report["input_storage"] == "linked"
          staged = Path("prepared/reads/reads.fastq")
          assert staged.is_symlink()
          assert staged.resolve() == Path("first-run/inputs/reads.fastq").resolve()
          assert 'status = "draft"' in Path("prepared/assay.toml").read_text()
          assert not Path("prepared/assay_out").exists()
          print("Installed offline first run and linked-input preparation verified")
          PYCODE
          mkdir "$root/evaluation-artifact"
          cp -R comparison identical regression mapped first-run "$root/evaluation-artifact/"
      - name: Retain exact review source and build identity
        run: |
          git rev-parse HEAD > evaluation-artifact/source-commit.txt
          git archive --format=tar.gz --output=evaluation-artifact/source.tar.gz HEAD
          cp dist/*.whl dist/*.tar.gz evaluation-artifact/
          (cd evaluation-artifact && sha256sum *.whl *.tar.gz source-commit.txt > SHA256SUMS)
          printf '%s\n' 'Unreleased review build. No biological validation or external adoption is implied.' > evaluation-artifact/REVIEW-BUILD.txt
      - uses: actions/upload-artifact@v7
        with:
          name: installed-count-comparison
          path: evaluation-artifact/
          retention-days: 7
          if-no-files-found: error
