name: Prepare approved 0.5.0 release
on:
  push:
    branches: [improve/scientist-first-library-audit]
    paths: [scripts/prepare_050_release.py, scripts/finalize_050_candidate.py, .github/workflows/prepare-050.yml]
permissions:
  contents: write
concurrency:
  group: prepare-dotmatch-050
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Migrate release-specific assertions without relaxing contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          def change(name, old, new):
              path = Path(name)
              text = path.read_text()
              assert text.count(old) == 1, (name, old)
              path.write_text(text.replace(old, new))
          change('scripts/prepare_050_release.py', "== '310c3e0fff133be31b88dd9c307bb36ea2f25fbc'", "== '40dfd1e483adf28ed6b93b9bf3a343a8be07bd2d'")
          change('python/tests/test_agent_tools.py', 'assert contract["generated_for_version"] == "0.4.1"', 'from dotmatch import __version__\n    assert contract["generated_for_version"] == __version__')
          change('python/tests/test_assayspec.py', 'assert "doi = {10.5281/zenodo.22214073}" in citation', '''cff = (ROOT / "CITATION.cff").read_text(encoding="utf-8")
              doi_lines = [line for line in cff.splitlines() if line.startswith("doi:")]
              expected_doi = doi_lines[0].split(":", 1)[1].strip().strip('"') if doi_lines else "10.5281/zenodo.20541628"
              assert "doi = {" + expected_doi + "}" in citation
              from dotmatch import __version__
              assert "version = {" + __version__ + "}" in citation''')
          change('python/tests/test_packaging_artifacts.py', "assert '\\ndoi: \"10.5281/zenodo.22214073\"' in citation", '''record = json.loads((ROOT / "docs/distribution-release.json").read_text(encoding="utf-8"))
              channel = next(item for item in record["channels"] if item["id"] == "zenodo")
              doi_lines = [line for line in citation.splitlines() if line.startswith("doi:")]
              if doi_lines:
                  assert record["release_version"] == _pyproject_version()
                  assert channel["status"] == "verified"
                  assert doi_lines[0].split(":", 1)[1].strip().strip('"') == channel["version_doi"]
              else:
                  assert channel["status"] in {"prepared", "blocked"}
                  assert "doi" not in zenodo
              assert 'doi: "10.5281/zenodo.22214073"' not in citation''')
          PY
          python scripts/prepare_050_release.py
          python scripts/finalize_050_candidate.py
          # Validate the final tree, not these temporary integration transports.
          rm scripts/prepare_050_release.py scripts/finalize_050_candidate.py .github/workflows/prepare-050.yml
      - name: Install validation tooling
        run: python -m pip install build pytest -r docs/requirements.txt
      - name: Validate release metadata, package and scientific boundaries
        run: |
          make all shared
          make python-test
          make repository-ready
          make release-ready
          make citation-metadata-ready
          make distribution-record-ready
          make agent-discovery-ready
          make agent-reference-workflows-ready
      - name: Commit the validated candidate without changing unrelated files
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/improve/scientist-first-library-audit | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add docs/releases/distribution-0.4.1.json
          git diff --cached --stat
          git commit -m 'release: prepare validated DotMatch 0.5.0 metadata and citation boundaries'
          git push origin HEAD:refs/heads/improve/scientist-first-library-audit
          git rev-parse HEAD
      - name: Collect review source
        if: always()
        run: |
          mkdir -p /tmp/prepare-review
          git status --short > /tmp/prepare-review/status.txt
          git diff > /tmp/prepare-review/uncommitted.diff
          tar --exclude=.git --exclude=build --exclude=node_modules --exclude=docs/_build --exclude='*.so' --exclude='*.a' -czf /tmp/prepare-review/source.tar.gz .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-candidate-review
          path: /tmp/prepare-review/
