name: Build reviewed release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/generate_schemas.py --check
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: editwitness-research-alpha-distributions
          path: dist/*
# Building is not publication. Configure reviewed PyPI trusted publishing separately.
