name: Build reviewed release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/generate_schemas.py --check
      - run: python -m build
      - name: Install and exercise the built wheel outside the source tree
        shell: bash
        run: python scripts/smoke_wheel.py dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editwitness-research-alpha-distributions
          path: dist/*
# Building is not publication. Configure reviewed PyPI trusted publishing separately.
