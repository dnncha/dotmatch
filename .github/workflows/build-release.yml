name: Build reviewed release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/generate_schemas.py --check
      - run: python -m build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: editwitness-research-alpha-distributions
          path: dist/*
# Building is not publication. Configure reviewed PyPI trusted publishing separately.
