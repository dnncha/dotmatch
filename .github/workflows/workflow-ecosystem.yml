name: workflow-ecosystem

on:
  push:
    paths:
      - ".github/workflows/workflow-ecosystem.yml"
      - "examples/workflows/**"
      - "python/dotmatch/**"
      - "scripts/check_workflow_examples.py"
      - "scripts/run_workflow_integration_tests.py"
      - "Makefile"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/workflow-ecosystem.yml"
      - "examples/workflows/**"
      - "python/dotmatch/**"
      - "scripts/check_workflow_examples.py"
      - "scripts/run_workflow_integration_tests.py"
      - "Makefile"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  workflow-ecosystem:
    name: Nextflow, nf-test, Snakemake, Galaxy, MultiQC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: dotmatch-workflows
          create-args: >-
            -c conda-forge
            -c bioconda
            python=3.11
            openjdk=17
            nextflow
            nf-test
            snakemake-minimal
            planemo
            multiqc
            pip
      - name: Install Python package and Galaxy lint extras
        shell: bash -el {0}
        run: |
          python -m pip install -e ".[multiqc]"
          python -m pip install edam-ontology
      - name: Check workflow example inventory
        shell: bash -el {0}
        run: make workflow-examples-ready
      - name: Run workflow-manager integration smoke tests
        shell: bash -el {0}
        run: make workflow-integration-test
