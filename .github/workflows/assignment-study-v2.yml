name: Assignment study v2 empirical acquisition
on:
  push:
    branches: [research/assignment-study-v2-20260926]
    paths:
      - 'research/assignment-study-v2/acquire_public_runs.py'
      - '.github/workflows/assignment-study-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        accession: [ERR376998, ERR376999, ERR377000]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Acquire and count complete public accession
        run: python research/assignment-study-v2/acquire_public_runs.py '${{ matrix.accession }}' --out 'study-artifacts/${{ matrix.accession }}'
      - name: Preserve available evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assignment-study-v2-${{ matrix.accession }}
          path: study-artifacts/${{ matrix.accession }}/
          retention-days: 14
          if-no-files-found: warn
