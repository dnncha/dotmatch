name: download-metrics

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh public download metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Collect provider metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_download_metrics.py --output docs/download-metrics.json
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- docs/download-metrics.json; then
            echo "Download metrics are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/download-metrics.json
          git commit -m "Refresh public download metrics"
          git push
