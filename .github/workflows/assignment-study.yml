name: Assignment study
on:
  push:
    branches: [research/assignment-study-20260925]
    paths:
      - '.github/workflows/assignment-study.yml'
      - 'research/assignment_study/**'
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Execute frozen full-run study
        run: python research/assignment_study/execute.py --out study-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assignment-study-${{ github.run_id }}
          path: study-output/
          retention-days: 14
          if-no-files-found: error
