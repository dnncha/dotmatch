name: Assignment study
on:
  push:
    branches: [research/assignment-study-20260925]
    paths:
      - '.github/workflows/assignment-study.yml'
      - 'research/assignment_study/**'
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve public input metadata
        run: |
          mkdir -p study-output
          python - <<'PY'
          import json, urllib.request, pathlib, time
          out=pathlib.Path('study-output')
          for acc in ['ERR376998','ERR376999']:
              urls={
                'ena_run':f'https://www.ebi.ac.uk/ena/portal/api/filereport?accession={acc}&result=read_run&fields=run_accession,study_accession,sample_accession,experiment_accession,read_count,base_count,fastq_ftp,fastq_bytes,fastq_md5&format=json',
                'ena_xml':f'https://www.ebi.ac.uk/ena/browser/api/xml/{acc}'}
              for kind,url in urls.items():
                  for attempt in range(3):
                      try:
                          with urllib.request.urlopen(url,timeout=90) as r: data=r.read()
                          (out/f'{acc}.{kind}.txt').write_bytes(data)
                          print(acc,kind,data.decode()[:12000],flush=True)
                          break
                      except Exception as e:
                          print('retrieval attempt',attempt,repr(e),flush=True)
                          if attempt==2: raise
                          time.sleep(3)
          PY
      - name: Execute frozen study when analysis is present
        if: hashFiles('research/assignment_study/run.py') != ''
        run: python research/assignment_study/run.py --out study-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-study-${{ github.run_id }}
          path: study-output/
          retention-days: 14
          if-no-files-found: error
