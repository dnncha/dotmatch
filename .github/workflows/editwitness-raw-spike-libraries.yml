name: EditWitness raw spike-in libraries
on:
  push:
    branches: ['editwitness/heldout-spikes-20260906']
    paths: ['.github/workflows/editwitness-raw-spike-libraries.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve full predeclared public cohort
        shell: bash
        run: |
          mkdir -p spike-evidence
          cp .github/workflows/editwitness-raw-spike-libraries.yml spike-evidence/workflow.yml
          python - <<'PY'
          from pathlib import Path
          import urllib.request, urllib.parse, json, csv, hashlib, gzip, datetime, platform, time, traceback
          out=Path('spike-evidence'); receipts=[]
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''): h.update(b)
              return h.hexdigest()
          def fetch(url,path,max_bytes,md5=None,size=None):
              path=out/path; part=path.with_suffix(path.suffix+'.part')
              req=urllib.request.Request(url,headers={'User-Agent':'EditWitness-public-evidence/0.1'})
              start=time.monotonic(); h=hashlib.md5(); n=0
              with urllib.request.urlopen(req,timeout=120) as r,part.open('wb') as f:
                  typ=r.headers.get('Content-Type'); final=r.url
                  while b:=r.read(1<<20):
                      n+=len(b)
                      if n>max_bytes:raise RuntimeError('download exceeds declared byte budget')
                      h.update(b);f.write(b)
              if size is not None and n!=size:raise RuntimeError(f'Byte mismatch: {path}')
              if md5 is not None and h.hexdigest()!=md5:raise RuntimeError(f'MD5 mismatch: {path}')
              part.replace(path)
              rec=dict(file=path.name,url=url,final_url=final,bytes=n,md5=h.hexdigest(),sha256=sha(path),content_type=typ,seconds=time.monotonic()-start)
              receipts.append(rec);(out/'download-receipts.json').write_text(json.dumps(receipts,indent=2)+'\n');return path
          fields='run_accession,sample_accession,sample_alias,read_count,base_count,fastq_ftp,fastq_md5,fastq_bytes'
          url='https://www.ebi.ac.uk/ena/portal/api/filereport?'+urllib.parse.urlencode(dict(accession='PRJEB53901',result='read_run',format='tsv',fields=fields))
          meta=fetch(url,'PRJEB53901.tsv',2000000)
          rows=list(csv.DictReader(meta.open(),delimiter='\t'))
          chosen=sorted([r for r in rows if r['sample_alias'].startswith('Spikes-')],key=lambda r:r['run_accession'])
          expected={f'ERR98977{i:02d}' for i in range(52,65)}
          if {r['run_accession'] for r in chosen}!=expected or len(chosen)!=13:raise RuntimeError('cohort changed')
          budget=sum(sum(map(int,r['fastq_bytes'].split(';'))) for r in chosen)
          if budget>400000000:raise RuntimeError('cohort exceeds 400 MB budget')
          (out/'cohort-plan.json').write_text(json.dumps(dict(utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),design='All 13 Spikes-* libraries; no UMI-library experiments; no read subsampling',compressed_bytes=budget,runs=chosen,claim='Data acquisition and QC, not independent-molecule calibration or published-caller validation'),indent=2)+'\n')
          optional=[]
          try:
              u='https://journals.plos.org/ploscompbiol/article/file?id=10.1371/journal.pcbi.1011137.s007&type=supplementary'
              p=fetch(u,'primer-table-s007.jpg',10000000)
              if p.read_bytes()[:2]!=b'\xff\xd8':raise RuntimeError('Primer table is not JPEG')
          except Exception as e: optional.append(dict(source='primer_table',error=str(e)))
          try:
              u='https://rest.ensembl.org/lookup/symbol/mus_musculus/Lama2?content-type=application/json'
              p=fetch(u,'Lama2-lookup.json',2000000);info=json.loads(p.read_text())
              u='https://rest.ensembl.org/sequence/id/'+info['id']+'?content-type=text/x-fasta'
              p=fetch(u,'Lama2-gene.fa',3000000)
              if not p.read_text().startswith('>'):raise RuntimeError('Lama2 source is not FASTA')
          except Exception as e: optional.append(dict(source='Lama2_reference',error=str(e)))
          qc=[]
          def record(f):
              name=f.readline()
              if not name:return None
              seq=f.readline().rstrip('\r\n');plus=f.readline();qual=f.readline().rstrip('\r\n')
              if not name.startswith('@') or not plus.startswith('+') or len(seq)!=len(qual) or not seq:raise RuntimeError('Malformed FASTQ')
              if any(ord(c)<33 or ord(c)>126 for c in qual):raise RuntimeError('Invalid quality bytes')
              token=name.split()[0]
              if token.endswith(('/1','/2')):token=token[:-2]
              return token,len(seq)
          for r in chosen:
              run=r['run_accession'];urls=r['fastq_ftp'].split(';');sizes=list(map(int,r['fastq_bytes'].split(';')));md5s=r['fastq_md5'].split(';')
              if len(urls)!=2 or len(sizes)!=2 or len(md5s)!=2:raise RuntimeError('Expected two complete paired files')
              files=[fetch('https://'+u,f'{run}_{i+1}.fastq.gz',s+1,md5=m,size=s) for i,(u,s,m) in enumerate(zip(urls,sizes,md5s))]
              n=0;nb=0
              with gzip.open(files[0],'rt') as a,gzip.open(files[1],'rt') as b:
                  while True:
                      x=record(a);y=record(b)
                      if x is None and y is None:break
                      if x is None or y is None or x[0]!=y[0]:raise RuntimeError('Paired record/ID mismatch')
                      n+=1;nb+=x[1]+y[1]
              if 2*n!=int(r['read_count']) or nb!=int(r['base_count']):raise RuntimeError('Archive read/base counts disagree')
              qc.append(dict(run=run,alias=r['sample_alias'],pairs=n,reads=2*n,bases=nb,status='complete'))
              (out/'paired-qc.json').write_text(json.dumps(qc,indent=2)+'\n');print(qc[-1],flush=True)
          (out/'execution.json').write_text(json.dumps(dict(status='complete',utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),python=platform.python_version(),optional_source_errors=optional,libraries=len(qc),pairs=sum(r['pairs'] for r in qc),raw_read_analysis='No aligner, variant caller, or original-molecule inference executed in this acquisition workflow.'),indent=2)+'\n')
          lines=[sha(p)+'  '+p.name for p in sorted(out.iterdir()) if p.is_file()]
          (out/'SHA256SUMS').write_text('\n'.join(lines)+'\n')
          PY
      - name: Preserve evidence including failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editwitness-13-complete-spike-libraries
          path: spike-evidence/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
