name: Integrate approved release fixes
on:
  push:
    branches: [improve/scientist-first-library-audit]
    paths: [scripts/integrate_release_fixes.py, .github/workflows/integrate-release.yml]
permissions:
  contents: write
concurrency:
  group: integrate-dotmatch-release
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply exact reviewed changes
        run: python scripts/integrate_release_fixes.py
      - name: Test package with optional dataframe dependencies installed
        run: |
          python -m pip install pytest build pandas polars pyarrow
          make all shared
          make python-test
      - name: Commit only approved paths; remove one-shot transport
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/improve/scientist-first-library-audit | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add python/dotmatch/core.py python/dotmatch/tl.py python/dotmatch/cli.py README.md scripts/check_site_browser.py
          git rm scripts/integrate_release_fixes.py .github/workflows/integrate-release.yml
          git diff --cached --stat
          git commit -m 'fix: complete package reliability improvements and preserve release checks'
          git push origin HEAD:refs/heads/improve/scientist-first-library-audit
          git rev-parse HEAD
