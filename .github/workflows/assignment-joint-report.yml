name: Assignment research - validated AR003 report
on:
  push:
    branches: [research/joint-resolution-ar003]
    paths:
      - research/assignment_robustness/joint_report.py
      - .github/workflows/assignment-joint-report.yml
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require successful completion of the exact full-audit commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          url = 'https://api.github.com/repos/dnncha/dotmatch/actions/runs/34032669590'
          deadline = time.monotonic() + 1800
          while True:
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  run = json.load(response)
              assert run['head_sha'] == '68a406b41805b808e6428927c2b8ccd2a2e55f9f', 'Audit source commit changed'
              print('Audit state:', run['status'], run['conclusion'], flush=True)
              if run['status'] == 'completed':
                  assert run['conclusion'] == 'success', 'Incomplete or failed audit is not evidence'
                  break
              if time.monotonic() >= deadline:
                  raise TimeoutError('Full audit has not completed; no report generated')
              time.sleep(30)
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: assignment-joint-*
          run-id: 34032669590
          repository: dnncha/dotmatch
          github-token: ${{ github.token }}
          path: evidence/joint
      - uses: actions/download-artifact@v4
        with:
          pattern: assignment-replay-*
          run-id: 34030217143
          repository: dnncha/dotmatch
          github-token: ${{ github.token }}
          path: evidence/prior
      - name: Test analysis and independently reconcile complete counts and bounds
        run: |
          set -euo pipefail
          python research/assignment_robustness/joint_report.py --test 2>&1 | tee report-tests.log
          python research/assignment_robustness/joint_report.py --joint evidence/joint --replay evidence/prior --out report 2>&1 | tee report-run.log
      - name: Repeat report from a clean source checkout and compare every canonical file
        run: |
          set -euo pipefail
          git clone --no-hardlinks . clean-source
          python clean-source/research/assignment_robustness/joint_report.py --test 2>&1 | tee report-clean-tests.log
          python clean-source/research/assignment_robustness/joint_report.py --joint evidence/joint --replay evidence/prior --out report-replay > report-clean-run.log
          python - <<'PY'
          import hashlib, json, pathlib
          def hashes(root):
              return {p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path(root).iterdir() if p.is_file()}
          left, right = hashes('report'), hashes('report-replay')
          assert left == right, 'Clean-checkout report did not reproduce'
          pathlib.Path('report-reproduction.json').write_text(json.dumps({'completion':'complete','scope':'Clean source checkout; same complete verified audit evidence; not a second raw-FASTQ run','canonical_files_matching':len(left),'sha256':left},indent=2,sort_keys=True)+'\n')
          print('Byte-identical canonical report files:',len(left))
          PY
      - name: Assemble durable source and complete derived-evidence packet
        run: |
          set -euo pipefail
          mkdir -p packet/source
          git archive HEAD research/assignment_robustness .github/workflows/assignment-joint-resolution.yml .github/workflows/assignment-joint-report.yml | tar -x -C packet/source
          cp -r report packet/report
          cp -r evidence packet/evidence
          find packet/evidence -name '*.sqlite' -type f -delete
          cp report-*.log report-reproduction.json packet/
          git rev-parse HEAD > packet/report-source-commit.txt
          cat > packet/README.md <<'EOF'
          # DotMatch AR003: full-archive joint-resolution research

          Start with report/REPORT.md and report/VALIDATION.md. These are executed technical/descriptive results, not peer-reviewed biological discovery claims.

          Recompute the complete report without downloading FASTQs or installing DotMatch:

          ```bash
          python3 source/research/assignment_robustness/joint_report.py --test
          python3 source/research/assignment_robustness/joint_report.py --joint evidence/joint --replay evidence/prior --out reproduced-report
          ```

          The scripts require Python 3.11 or newer. The report itself uses the standard library only. Its first action verifies the full derived-evidence manifests and then independently reaggregates candidate classes and legacy guide counts.

          Full raw-read execution is recorded in GitHub Actions run 34032669590 at commit 68a406b41805b808e6428927c2b8ccd2a2e55f9f. The corresponding workflow and exact DotMatch engine commit are in source. Original public FASTQs are deliberately not redistributed in this packet; their official source URLs, SHA-256, MD5, byte counts and read counts are in each completion manifest. Short-lived GitHub input transport artifacts are an execution convenience, not permanent raw-data provenance.

          All three joint audits include complete candidate classes, all guide counts, all original gene-annotation lower/upper counts, read-state budgets and known-origin controls. Operational SQLite copies are excluded; canonical TSVs are complete. Prior replay artifacts, synthetic controls and the prior actual comparator evidence are retained separately. They are not newly generated by AR003.

          The clean-source report replay uses the same full-audit evidence and is not a second execution on raw FASTQs. Its exact scope and hashes are in report-reproduction.json.
          EOF
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('packet')
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'PACKET_SHA256.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dotmatch-AR003-complete-review-packet
          path: packet/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ar003-report-failure-evidence
          path: |
            report-*.log
            report/
          retention-days: 30
  preserve-reviewed-evidence:
    needs: report
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/joint-resolution-ar003
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dotmatch-AR003-complete-review-packet
          path: packet
      - name: Preserve completed research results, not production changes
        run: |
          set -euo pipefail
          test '${{ github.ref }}' = refs/heads/research/joint-resolution-ar003
          python - <<'PY'
          import hashlib,json,pathlib,shutil
          source=pathlib.Path('packet/report')
          completion=json.loads((source/'completion.json').read_text())
          assert completion['completion']=='complete'
          for name, expected in completion['files'].items():
              assert hashlib.sha256((source/name).read_bytes()).hexdigest()==expected,name
          destination=pathlib.Path('research/assignment_robustness/ar003/results')
          assert not destination.exists(), 'Do not silently overwrite an earlier scientific result'
          shutil.copytree(source,destination)
          shutil.copy2('packet/report-reproduction.json','research/assignment_robustness/ar003/report-reproduction.json')
          PY
          git config user.name 'Donncha OToole research workflow'
          git config user.email '5190258+dnncha@users.noreply.github.com'
          git add research/assignment_robustness/ar003
          git commit -m 'research: preserve complete verified AR003 results and clean report replay [skip ci]'
          git push origin HEAD:research/joint-resolution-ar003
