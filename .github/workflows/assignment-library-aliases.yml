name: Guide library overlap audit
on:
  push:
    branches: [research/assignment-robustness-2026-09]
    paths:
      - research/assignment_robustness/library_aliases.py
      - .github/workflows/assignment-library-aliases.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library-aliases:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python research/assignment_robustness/library_aliases.py test
      - run: python research/assignment_robustness/library_aliases.py --out library-alias-output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: library-aliases-${{ github.sha }}
          retention-days: 30
          path: |
            library-alias-output/**
            !library-alias-output/work/**
            research/assignment_robustness/**
