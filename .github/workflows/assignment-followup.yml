name: Assignment sequence follow-up
on:
  push:
    branches: [research/assignment-study-20260925]
    paths:
      - '.github/workflows/assignment-followup.yml'
      - 'research/assignment_followup/**'
permissions:
  contents: read
  actions: read
jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: assignment-study-36191069868
          run-id: 36191069868
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-study
      - name: Examine assigned sequence variants and base qualities
        run: python research/assignment_followup/run_followup.py --baseline original-study --out sequence-followup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assignment-sequence-followup-${{ github.run_id }}
          path: sequence-followup/
          retention-days: 14
          if-no-files-found: error
