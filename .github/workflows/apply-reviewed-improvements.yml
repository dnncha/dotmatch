name: Apply reviewed DotMatch improvements
# Temporary transport for a locally tested patch; removed through the authorized connector after application.
on:
  push:
    branches: [improve/scientist-first-library-audit]
    paths: [.review/**, .github/workflows/apply-reviewed-improvements.yml]
permissions:
  contents: write
concurrency:
  group: apply-dotmatch-reviewed-patch
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'dnncha/dotmatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify and apply exact locally tested patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts = sorted(pathlib.Path('.review').glob('part-*.b64'))
          assert len(parts) == 4
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '9a03e5524dc3f93fbc340a561f29991817efebb61e8c8e42152c6c134a3acda5'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
      - name: Format the new implementation
        run: |
          python3 -m pip install black==25.1.0 pytest
          python3 -m black python/dotmatch/sensitivity.py python/dotmatch/target_io.py python/tests/test_sensitivity.py python/tests/test_target_io.py python/tests/test_count_comparison_integrity.py scripts/generate_assignment_demo.py scripts/check_site_browser.py scripts/bench_policy_sensitivity.py
          npm exec --yes --package=prettier@3.6.2 -- prettier --write app/page.tsx app/assignment-demo.tsx app/assignment-sensitivity/page.tsx app/home.module.css app/install-command.tsx
      - name: Check core extension and executable website example
        run: |
          make -j2
          make shared
          PYTHONPATH=python:. python3 -m pytest -q python/tests/test_sensitivity.py python/tests/test_target_io.py python/tests/test_count_comparison_integrity.py python/tests/test_agent_discovery.py
          python3 scripts/generate_assignment_demo.py --check
          node scripts/check_site_assets.mjs
          git diff --check
      - name: Commit only source changes within contents permission
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/improve/scientist-first-library-audit | cut -f1)" = "$EXPECTED_SHA"
          rm -rf .review
          # Workflow edits are applied separately through the authorized connector.
          git restore --source=HEAD -- .github/workflows/site-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: one-pass policy sensitivity, reliable target loading, and scientist-first site'
          git push origin HEAD:refs/heads/improve/scientist-first-library-audit
          git rev-parse HEAD
