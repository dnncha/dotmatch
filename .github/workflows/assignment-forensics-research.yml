name: Assignment forensics research
on:
  push:
    branches: [research/assignment-robustness-2026-09]
    paths:
      - research/assignment_robustness/forensics.py
      - .github/workflows/assignment-forensics-research.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Inspect unmodified reference files
        run: python research/assignment_robustness/forensics.py inspect --out reference-inspection
      - name: Install the historical comparator and source-pinned DotMatch
        run: |
          cargo install guide-counter --version 0.1.3 --locked
          python -m pip install --no-deps .
          cargo --version > forensic-environment.txt
          rustc --version >> forensic-environment.txt
          python -m pip freeze >> forensic-environment.txt
          git rev-parse HEAD >> forensic-environment.txt
      - name: Reconstruct historical Yusa counts and separate read records from matching events
        env:
          PYTHONUNBUFFERED: '1'
        run: python research/assignment_robustness/forensics.py yusa --out historical-yusa
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: assignment-forensics-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            reference-inspection/**
            historical-yusa/**
            !historical-yusa/work/**
            research/assignment_robustness/**
            forensic-environment.txt
