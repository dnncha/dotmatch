name: AR004 - replicated gene statistics
on:
  push:
    branches: [research/replicated-screen-ar004]
    paths: [research/assignment_robustness/ar004/statistics.py, .github/workflows/ar004-statistics.yml]
permissions:
  contents: read
  actions: read
jobs:
  statistics:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: ar004-mageck-pinned-engine
          run-id: 34034892731
          repository: dnncha/dotmatch
          github-token: ${{ github.token }}
          path: statistics-engine
      - name: Install verified original MAGeCK release and test the analysis
        run: |
          set -euo pipefail
          python -m pip install numpy==1.23.5 scipy==1.10.1 setuptools==68.2.2 > statistics-install.log 2>&1
          EXPECTED=$(awk '{print $1}' research/assignment_robustness/ar004/mageck/source.sha256)
          test "$(sha256sum statistics-engine/mageck-0.5.9.5.tar.gz | cut -d' ' -f1)" = "$EXPECTED"
          mkdir pristine-source
          tar -xzf statistics-engine/mageck-0.5.9.5.tar.gz -C pristine-source
          SETUP=$(find pristine-source -name setup.py | head -1)
          (cd "$(dirname "$SETUP")" && python setup.py install) >> statistics-install.log 2>&1
          test "$(mageck --version)" = 0.5.9.5
          python research/assignment_robustness/ar004/statistics.py --test 2>&1 | tee statistics-tests.log
          python -m pip freeze > statistics-environment.txt
      - name: Require all complete raw archives from the locked counting commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/dnncha/dotmatch/actions/runs/34034542345'
          for attempt in range(70):
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request,timeout=60) as response: run=json.load(response)
              assert run['head_sha']=='862bdc1e0c026b2ce7475870af1a4a2171c98cfb'
              print('Locked full-count run:',run['status'],run['conclusion'],flush=True)
              if run['status']=='completed':
                  assert run['conclusion']=='success','A failed or partial raw-read run cannot support gene statistics'
                  break
              time.sleep(30)
          else:raise TimeoutError('Raw-data gate did not complete; no statistical result generated')
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: ar004-count-*
          run-id: 34034542345
          repository: dnncha/dotmatch
          github-token: ${{ github.token }}
          path: evidence/counts
      - name: Aggregate technical runs then execute all locked contrasts and repeated-input controls
        run: |
          set -euo pipefail
          python research/assignment_robustness/ar004/statistics.py --evidence evidence/counts --out statistics-results 2>&1 | tee statistics-run.log
      - name: Preserve source and full downstream evidence
        run: |
          set -euo pipefail
          mkdir -p packet/source
          git archive HEAD research/assignment_robustness/ar004 research/assignment_robustness/replay.py research/assignment_robustness/joint_resolution.py .github/workflows/ar004-count.yml .github/workflows/ar004-statistics.yml .github/workflows/ar004-statistics-tools.yml .github/workflows/ar004-reco.yml | tar -x -C packet/source
          cp -r statistics-results packet/results
          cp -r evidence packet/evidence
          cp statistics-*.log statistics-environment.txt packet/
          cp statistics-engine/mageck-0.5.9.5.tar.gz packet/
          git rev-parse HEAD > packet/source-commit.txt
          python - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path('packet')
          files={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.rglob('*')) if f.is_file()}
          (p/'PACKET_SHA256.json').write_text(json.dumps(files,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ar004-replicated-statistics-complete
          path: packet/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ar004-statistics-failure
          path: |
            statistics-results/
            statistics-*.log
          retention-days: 90
  preserve:
    needs: statistics
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/replicated-screen-ar004
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ar004-replicated-statistics-complete
          path: packet
      - name: Commit completed research reports without changing production
        run: |
          set -euo pipefail
          test '${{ github.ref }}' = refs/heads/research/replicated-screen-ar004
          python - <<'PY'
          import pathlib,json,hashlib,shutil
          root=pathlib.Path('packet/results');m=json.loads((root/'completion.json').read_text());assert m['completion']=='complete'
          for name,h in m['files'].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==h,name
          out=pathlib.Path('research/assignment_robustness/ar004/results');out.mkdir(exist_ok=False)
          for name in ('REPORT.md','summary.json','run-accounting.tsv','eligibility.tsv','all-discordant-calls.tsv','all-large-effect-differences.tsv'):
              shutil.copy2(root/name,out/name)
          PY
          git config user.name 'Donncha OToole research workflow'
          git config user.email '5190258+dnncha@users.noreply.github.com'
          git add research/assignment_robustness/ar004/results
          git commit -m 'research: preserve executed replicated MAGeCK findings and complete outlier tables [skip ci]'
          git push origin HEAD:research/replicated-screen-ar004
