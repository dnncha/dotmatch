name: Asthma raw measurement provenance
on:
  push:
    branches: [research/asthma-public-data-20260925]
    paths: [.github/workflows/asthma-raw-provenance.yml]
permissions:
  contents: read
jobs:
  hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Hash original measurements with bounded memory and size
        run: |
          mkdir asthma-raw-provenance
          python -u - <<'PY'
          import urllib.request,pathlib,json,hashlib,gzip,csv,io,concurrent.futures,time
          out=pathlib.Path('asthma-raw-provenance'); jobs=[]
          for acc in ['GSE4302','GSE67472','GSE43696','GSE63142']:
           url='https://ftp.ncbi.nlm.nih.gov/geo/series/'+acc[:-3]+'nnn/'+acc+'/matrix/'+acc+'_series_matrix.txt.gz'
           with urllib.request.urlopen(url,timeout=20) as r: text=gzip.decompress(r.read(150_000_001)).decode()
           lines={}
           for row in csv.reader(io.StringIO(text.split('!series_matrix_table_begin')[0]),delimiter='\t'):
            if row and row[0] in ['!Sample_geo_accession','!Sample_supplementary_file','!Sample_title']: lines[row[0]]=row[1:]
           for sample,title,url in zip(lines['!Sample_geo_accession'],lines['!Sample_title'],lines['!Sample_supplementary_file']):
            jobs.append({'dataset':acc,'sample':sample,'title':title,'url':url.replace('ftp://','https://')})
          (out/'input_manifest.json').write_text(json.dumps(jobs,indent=2))
          def work(row):
           for attempt in range(2):
            try:
             with urllib.request.urlopen(row['url'],timeout=25) as r: compressed=r.read(60_000_001)
             if len(compressed)>60_000_000: raise ValueError('Compressed file size guard')
             raw=gzip.decompress(compressed)
             if len(raw)>200_000_000: raise ValueError('Uncompressed file size guard')
             result={**row,'compressed_bytes':len(compressed),'uncompressed_bytes':len(raw),'compressed_sha256':hashlib.sha256(compressed).hexdigest(),'uncompressed_sha256':hashlib.sha256(raw).hexdigest(),'header_hex':raw[:80].hex()}
             if row['sample'] in ['GSM98141','GSM1647646','GSM1068458','GSM1541999']:
              (out/(row['sample']+'.raw.gz')).write_bytes(compressed)
             print(json.dumps(result),flush=True);return result
            except Exception as e:
             err=str(e);time.sleep(1)
           result={**row,'error':err};print(json.dumps(result),flush=True);return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
           with open(out/'raw_hashes.jsonl','w') as f:
            for row in pool.map(work,jobs): f.write(json.dumps(row)+'\n');f.flush()
          print('COMPLETED',len(jobs),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asthma-raw-provenance
          path: asthma-raw-provenance/
          compression-level: 0
          retention-days: 30
