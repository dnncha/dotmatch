name: Assignment study offline checks
on:
  push:
    branches: [research/assignment-robustness-2026-09]
    paths:
      - research/assignment_robustness/**
      - .github/workflows/assignment-study-checks.yml
  pull_request:
    paths:
      - research/assignment_robustness/**
      - .github/workflows/assignment-study-checks.yml
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Validate independent algorithms and fail-closed evidence handling
        run: |
          python research/assignment_robustness/pilot.py test
          python research/assignment_robustness/full_yusa.py test
          python research/assignment_robustness/library_aliases.py test
          python research/assignment_robustness/test_summary.py
          python -m compileall -q research/assignment_robustness
