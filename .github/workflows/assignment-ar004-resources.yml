name: AR004 verified source and ESC2 acquisition
on:
  push:
    branches: [research/read-evidence-ar004]
    paths: [.github/workflows/assignment-ar004-resources.yml]
permissions:
  contents: read
  actions: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Retrieve complete original inputs, never synthetic substitutes
        run: |
          set -euo pipefail
          mkdir resources
          python - <<'PY'
          import hashlib,json,pathlib,urllib.request,urllib.parse
          root=pathlib.Path('resources')
          def fetch(url,path,expected_sha=None,expected_md5=None,expected_size=None):
              sha=hashlib.sha256(); md5=hashlib.md5(usedforsecurity=False); n=0
              req=urllib.request.Request(url,headers={'User-Agent':'DotMatch AR004 reproducibility research'})
              with urllib.request.urlopen(req,timeout=120) as r,path.with_suffix('.pending').open('xb') as f:
                  for b in iter(lambda:r.read(1048576),b''):
                      n+=len(b)
                      if n>1000000000: raise ValueError('1 GB per-file bound exceeded')
                      sha.update(b);md5.update(b);f.write(b)
              if expected_size is not None: assert n==expected_size,(n,expected_size)
              if expected_md5 is not None: assert md5.hexdigest()==expected_md5
              if expected_sha is not None: assert sha.hexdigest()==expected_sha
              path.with_suffix('.pending').replace(path)
              return dict(url=url,bytes=n,sha256=sha.hexdigest(),md5=md5.hexdigest())
          mageck=fetch('https://bitbucket.org/liulab/mageck/get/v0.5.9.5.tar.gz',root/'mageck-v0.5.9.5.tar.gz',expected_sha='b06a18036da63959cd7751911a46727aefe2fb1d8dd79d95043c3e3bdaf1d93a')
          (root/'mageck-source.json').write_text(json.dumps(mageck,indent=2)+'\n')
          url='https://www.ebi.ac.uk/ena/portal/api/filereport?'+urllib.parse.urlencode(dict(accession='ERR377000',result='read_run',format='json',fields='run_accession,study_accession,sample_accession,sample_alias,experiment_title,library_layout,fastq_ftp,fastq_md5,fastq_bytes,read_count'))
          with urllib.request.urlopen(url,timeout=60) as r: rows=json.load(r)
          assert len(rows)==1 and rows[0]['run_accession']=='ERR377000'
          row=rows[0]; assert row['library_layout']=='SINGLE'
          assert ';' not in row['fastq_ftp'] and row['fastq_ftp'].startswith('ftp.sra.ebi.ac.uk/')
          raw=fetch('https://'+row['fastq_ftp'],root/'ERR377000.fastq.gz',expected_md5=row['fastq_md5'],expected_size=int(row['fastq_bytes']))
          row.update(raw);row['metadata_url']=url
          (root/'ERR377000.provenance.json').write_text(json.dumps(row,indent=2,sort_keys=True)+'\n')
          print(json.dumps(row,sort_keys=True))
          PY
      - name: Build actual statistical engine and save complete source
        run: |
          set -euo pipefail
          mkdir source
          tar -xzf resources/mageck-v0.5.9.5.tar.gz -C source --strip-components=1
          python -m pip install numpy==1.23.5 scipy==1.10.1 > resources/install.log 2>&1
          python -m pip install ./source >> resources/install.log 2>&1
          mageck --version | tee resources/mageck-version.txt
          mageck test --help > resources/mageck-test-help.txt
          python -m pip freeze > resources/environment.txt
          cp -r source resources/mageck-source
          command -v RRA | tee resources/rra-path.txt
          sha256sum "$(command -v RRA)" > resources/rra-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ar004-original-esc2-and-mageck
          path: resources/
          retention-days: 30
