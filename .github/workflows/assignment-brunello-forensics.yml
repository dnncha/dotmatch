name: Brunello assignment forensics
on:
  push:
    branches: [research/assignment-robustness-2026-09]
    paths:
      - research/assignment_robustness/brunello_forensics.py
      - .github/workflows/assignment-brunello-forensics.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brunello-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Test independent decoders
        run: |
          python research/assignment_robustness/pilot.py test
          python research/assignment_robustness/full_yusa.py test
      - name: Install pinned comparator and baseline
        run: |
          cargo install guide-counter --version 0.1.3 --locked
          python -m pip install --no-deps .
          python -m pip freeze > brunello-environment.txt
          cargo --version >> brunello-environment.txt
          rustc --version >> brunello-environment.txt
          git rev-parse HEAD >> brunello-environment.txt
      - name: Reconstruct every comparator guide count in all four prefixes
        env:
          PYTHONUNBUFFERED: '1'
        run: python research/assignment_robustness/brunello_forensics.py --out brunello-forensic-output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: brunello-forensics-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            brunello-forensic-output/**
            !brunello-forensic-output/work/**
            research/assignment_robustness/**
            brunello-environment.txt
