name: Verify EditWitness
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact committed source to verify; used by the temporary release transport
        required: false
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/check_style.py
      - run: python scripts/generate_schemas.py --check
      - run: python scripts/release_manifest.py --check
      - run: python -m build
      - run: python -m editwitness self-test
  minimum-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]" "pydantic==2.7.0"
      - run: python -m pytest -q
      - run: python -m editwitness self-test
  typing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python -m mypy src/editwitness
      - run: python -m ruff check src/editwitness --select E4,E7,E9,F
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_coverage.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: editwitness-coverage
          path: coverage.json
          if-no-files-found: error
  distributions:
    needs: [test, minimum-dependency, typing, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/release_manifest.py --check
      - run: python -m build
      - run: python scripts/smoke_wheel.py
      - run: python scripts/check_sdist.py
      - run: python scripts/distribution_checksums.py
      - run: python scripts/release_evidence.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: editwitness-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: editwitness-release-evidence
          path: release-support/*
          if-no-files-found: error
