name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - run: python -m pip install -r requirements-quality.txt pytest
      - run: make quality
      - name: Prove architecture violations fail
        run: python -m pytest python/tests/test_architecture.py -q --junitxml=architecture-tests.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: architecture-tests
          path: architecture-tests.xml
          retention-days: 7

  build-test:
    needs: quality
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Native compiler warnings as errors
        run: make native-lint
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: CLI test
        run: make cli-test
      - name: Python test dependencies
        run: python3 -m pip install pytest -r docs/requirements.txt
      - name: Python tests
        run: make python-test
      - name: Python package build
        run: |
          python3 -m pip install build
          make python-package-test
      - name: Evidence gates
        run: |
          make public-crispr-evidence-gate
          make crispr-comparison-gate
          make perturb-seq-smoke-gate
          make feature-barcode-smoke-gate
          make amplicon-panel-smoke-gate
          make repository-ready
          make release-ready
          make assay-evidence-ready
          make joss-paper-ready

  python-compat:
    needs: quality
    timeout-minutes: 20
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python test dependencies
        run: python3 -m pip install build pytest
      - name: Python tests
        run: make python-test
      - name: Python package smoke test
        run: make python-package-test

  reviewer-repro:
    needs: quality
    timeout-minutes: 20
    name: Reviewer reproducibility packet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build reviewer reproducibility packet
        run: make repro-small
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reviewer-repro-packet
          path: repro/small/

  web:
    name: Website checks
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:site
      - run: npm audit --audit-level=moderate
      - run: npm run build

  native-safety:
    name: Native analysis and sanitizers
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Native analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm gcc-13
      - name: GCC static analysis (warnings are errors)
        run: |
          set -o pipefail
          make native-analyze ANALYZER_CC=gcc-13 2>&1 | tee native-analysis.log
      - name: Address and undefined-behavior sanitizers
        run: make asan CC=clang
      - name: Native coverage
        run: make coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-analysis-and-coverage
          path: |
            native-analysis.log
            build/coverage/coverage.txt
            build/coverage/coverage.json
            build/coverage/html/
          retention-days: 7

  required:
    name: CI required
    if: always()
    needs: [quality, build-test, python-compat, reviewer-repro, web, native-safety]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              raise SystemExit("Required CI jobs did not succeed: " + ", ".join(failed))
          print("All required CI jobs passed")
          PY
