name: EditWitness original assay sources
on:
  push:
    branches: [editwitness/empirical-audit-20260906]
    paths: [.github/workflows/editwitness-assay-sources.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve original public sample and assay sources
        shell: bash
        run: |
          mkdir -p sources
          cat > sources/retrieve.py <<'PY'
          import pathlib, urllib.request, urllib.parse, json, hashlib, time, csv, io, zipfile
          from datetime import datetime,timezone
          root=pathlib.Path('sources'); recs=[]
          def fetch(name,url,limit=60000000):
              rec={'name':name,'url':url,'utc':datetime.now(timezone.utc).isoformat()}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'EditWitness-research-audit/0.0.2'}),timeout=50) as r:
                      data=r.read(limit+1); rec.update(status=r.status,content_type=r.headers.get('Content-Type'),final_url=r.url)
                  if len(data)>limit: raise ValueError('size budget exceeded')
                  (root/name).write_bytes(data); rec.update(ok=True,bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                  recs.append(rec); print(json.dumps(rec),flush=True); return data
              except Exception as e:
                  rec.update(ok=False,error=str(e));recs.append(rec);print(json.dumps(rec),flush=True)
          meta=fetch('run-table.tsv','https://www.ebi.ac.uk/ena/portal/api/filereport?'+urllib.parse.urlencode({'accession':'PRJNA916868','result':'read_run','format':'tsv','fields':'run_accession,sample_accession,experiment_accession,fastq_ftp,fastq_md5,fastq_bytes,submitted_ftp,submitted_md5,submitted_bytes,submitted_format'}))
          if meta:
              for acc in sorted({r['sample_accession'] for r in csv.DictReader(io.StringIO(meta.decode()),delimiter='\t')}):
                  fetch(acc+'.xml','https://www.ebi.ac.uk/ena/browser/api/xml/'+acc)
          supp=fetch('Simpson-supplement.pdf','https://pmc.ncbi.nlm.nih.gov/articles/instance/10014281/bin/mmc1.pdf')
          if not supp or not supp.startswith(b'%PDF'):
              fetch('Simpson-supplements.zip','https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10014281/supplementaryFiles')
          fetch('hg38-ATXN2-region.json','https://api.genome.ucsc.edu/getData/sequence?genome=hg38;chrom=chr12;start=111449213;end=111618315')
          (root/'receipts.json').write_text(json.dumps(recs,indent=2))
          PY
          python sources/retrieve.py
      - name: Preserve inputs and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: editwitness-original-assay-sources
          path: sources/
          retention-days: 30
          if-no-files-found: error
